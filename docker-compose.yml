services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_USER=wedding_user
      - DB_PASS=wedding_password
      - DB_NAME=wedding_db
    volumes:
      - wedding_uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: wedding_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: wedding_db
      MYSQL_USER: wedding_user
      MYSQL_PASSWORD: wedding_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_change_me"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data:
  wedding_uploads:

